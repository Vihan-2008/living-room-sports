<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Room Sports</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/menu.css">
</head>
<body class="console">
<div class="stage" id="stage">
  <section class="home" id="home" aria-label="Wii Menu">
    <div class="grid-window"><div class="pages" id="pages"></div></div>
    <button type="button" class="page-arrow prev" id="page-prev" aria-label="Previous page" data-sound="page" hidden><svg viewBox="0 0 24 40" aria-hidden="true"><path d="M17 6L5 20l12 14"/></svg></button>
    <button type="button" class="page-arrow next" id="page-next" aria-label="Next page" data-sound="page"><svg viewBox="0 0 24 40" aria-hidden="true"><path d="M7 6l12 14L7 34"/></svg></button>
    <div class="clock" id="clock" role="img"></div>
    <div class="shelf">
      <svg class="shelf-shape" id="shelf-shape" height="134" aria-hidden="true">
        <defs>
          <linearGradient id="shelf-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfefe"/><stop offset=".55" stop-color="#eef1f2"/><stop offset="1" stop-color="#dfe4e6"/></linearGradient>
        </defs>
        <path class="shelf-fill" fill="url(#shelf-gradient)"/>
        <path class="shelf-shine" fill="none" stroke="#fff" stroke-width="3" transform="translate(0 3)"/>
        <path class="shelf-edge" fill="none" stroke="#4cc6ef" stroke-width="2.5"/>
      </svg>
      <button type="button" class="shelf-button options" id="open-options" aria-label="Wii Options">
        <span class="balloon">Wii Options</span><span class="shelf-word">Options</span>
      </button>
      <p class="date" id="date"></p>
      <button type="button" class="shelf-button controllers" id="open-controllers" aria-label="Connect controllers">
        <span class="balloon">Connect controllers</span>
        <svg class="shelf-glyph" viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="44" rx="8"/><path d="M28 17h8M32 13v8"/><circle cx="32" cy="30" r="3.4"/></svg>
        <span class="leds"><i class="led"></i><i class="led"></i><i class="led"></i><i class="led"></i></span>
      </button>
    </div>
  </section>
  <section class="preview" id="preview" aria-label="Channel" hidden>
    <canvas class="banner" id="banner"></canvas>
    <div class="preview-foot" id="preview-foot">
      <p class="preview-status" id="preview-status" hidden></p>
      <div class="preview-buttons">
        <button type="button" class="wbtn big" id="preview-menu" data-sound="back"><span class="wbtn-label">Wii Menu</span></button>
        <button type="button" class="wbtn big" id="preview-start" data-sound="start" data-default><span class="wbtn-label">Start</span></button>
      </div>
    </div>
  </section>
  <div class="views" id="views"></div>
  <div class="zoomer" id="zoomer" hidden><canvas></canvas></div>
  <div class="fade" id="fade"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="offline" id="offline" role="alert" hidden><p>The console service has stopped.</p><p>Close this window and open Living Room Sports again from its shortcut.</p></div>
  <div class="dialog-layer" id="dialog" hidden></div>
  <div class="hands" id="hands" aria-hidden="true"></div>
</div>
<noscript><p class="noscript">The Wii Menu needs JavaScript. Open Living Room Sports from its shortcut.</p></noscript>
<script type="module" src="/menu.js"></script>
</body>
</html>
